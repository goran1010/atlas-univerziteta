# prerender-meta.ts runs under plain node, which strips types natively only
# on Node 22.18+ - pin the build image so a default downgrade cannot break it
[build.environment]
  NODE_VERSION = "24"

# Everything is self-hosted (fonts, images, the theme-init script) except the
# API calls and the OAuth profile photos, so the policy stays strict: no
# unsafe-inline anywhere.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://*.googleusercontent.com https://avatars.githubusercontent.com; font-src 'self'; connect-src 'self' https://api.atlasuniverziteta.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000"

[[redirects]]
  from = "https://atlas-univerziteta.netlify.app/*"
  to = "https://atlasuniverziteta.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/"
  status = 200