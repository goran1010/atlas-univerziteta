services:
  # --- Server: the Node.js API ---
  # Built from the Dockerfile in ./server.
  # Not exposed to the internet directly - the shared Caddy in the vps-proxy
  # stack reaches it over the "web" network at hostname "atlas-server".
  server:
    build: ./server
    restart: unless-stopped
    networks:
      default:
      # other apps' services on "web" may also be called "server", so Caddy
      # addresses each app by an alias of its own
      web:
        aliases:
          - atlas-server
    # Docker keeps container logs forever by default; cap each service at
    # 5 files of 10 MB, oldest dropped first
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      db:
        condition: service_healthy
    # node:26-slim ships no curl/wget; node's built-in fetch probes /health,
    # which includes a database round-trip
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - WEBAPP_URL=https://${WEBAPP_DOMAIN}
      - SERVER_URL=https://${DOMAIN}
      - PORT=3000
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - NODE_ENV=production
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - SENTRY_DSN=${SENTRY_DSN}

  # --- PostgreSQL database ---
  # Uses the official Postgres image. Data is stored in a named volume
  # so it survives container restarts and rebuilds.
  db:
    image: postgres:18
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  # shared by every app on the VPS and the vps-proxy stack; created once with
  # `docker network create web`
  web:
    external: true

volumes:
  pgdata:
