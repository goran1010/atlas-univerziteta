name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "docker-compose.yml"
      - "Caddyfile"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push server image
        run: |
          docker build -t ghcr.io/goran1010/atlas-univerziteta-server:latest ./server
          docker push ghcr.io/goran1010/atlas-univerziteta-server:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: 188.245.124.7
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/uniatlas-bosnia
            docker compose pull server
            docker compose up -d
