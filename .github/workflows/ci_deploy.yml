name: CI and Deploy

on:
  push:
    branches:
      - main

# the checks are the same reusable workflows the PR pipelines run
jobs:
  lint_type_check:
    uses: ./.github/workflows/lint_type_check.yml

  test:
    uses: ./.github/workflows/test.yml

  e2e:
    uses: ./.github/workflows/e2e.yml

  spell_format:
    uses: ./.github/workflows/spell_format_check.yml

  build:
    uses: ./.github/workflows/build.yml

  check_deploy_paths:
    runs-on: ubuntu-latest
    name: Check if deploy is needed
    needs: [lint_type_check, test, e2e, spell_format, build]
    outputs:
      should_deploy: ${{ steps.changes.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check for deploy-relevant changes
        id: changes
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE '^server/|^docker-compose(\.prod)?\.yml$|^Caddyfile$'; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    runs-on: ubuntu-latest
    name: Deploy API
    needs: [check_deploy_paths]
    if: needs.check_deploy_paths.outputs.should_deploy == 'true'
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push server image
        run: |
          docker build -t ghcr.io/goran1010/atlas-univerziteta-server:latest ./server
          docker push ghcr.io/goran1010/atlas-univerziteta-server:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: 188.245.124.7
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/atlas-univerziteta
            git pull --ff-only
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull server
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T caddy caddy reload --config /etc/caddy/Caddyfile
