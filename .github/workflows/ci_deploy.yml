name: CI and Deploy

on:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Run lint check
    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/postgres_db
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm run install:all

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint webapp
        run: npm run lint:webapp

      - name: Lint server
        run: npm run lint:server

      - name: Lint e2e
        run: npm run lint:e2e

  type_check:
    runs-on: ubuntu-latest
    name: Run type-check
    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/postgres_db
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm run install:all

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Type check webapp
        run: npm run typecheck:webapp

      - name: Type check server
        run: npm run typecheck:server

      - name: Type check e2e
        run: npm run typecheck:e2e

  test:
    runs-on: ubuntu-latest
    name: Run tests

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: postgres
        options: >-
          --health-cmd="pg_isready -U test_user -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      VITE_SERVER_URL: http://localhost:3000
      PORT: 3000
      WEBAPP_URL: http://localhost:5173
      NODE_ENV: test
      SERVER_URL: http://localhost:3000
      COOKIE_SECRET: "123456789"
      TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/postgres
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/postgres_db
      RESEND_API_KEY: random_text_for_ci
      GITHUB_CLIENT_ID: random_text_for_ci
      GITHUB_CLIENT_SECRET: random_text_for_ci
      GITHUB_CALLBACK_URL: random_text_for_ci
      GOOGLE_CLIENT_ID: random_text_for_ci
      GOOGLE_CLIENT_SECRET: random_text_for_ci
      GOOGLE_CALLBACK_URL: random_text_for_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm run install:all

      - name: Test webapp
        run: npm run test:webapp

      - name: Migrate database and generate Prisma client
        run: npm run db:deploy_generate

      - name: Test server
        run: npm run test:server

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Run Playwright e2e and a11y tests

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: postgres
        options: >-
          --health-cmd="pg_isready -U test_user -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      E2E_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/uniatlas_e2e
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/uniatlas_e2e
      COOKIE_SECRET: "123456789"
      RESEND_API_KEY: random_text_for_ci
      GITHUB_CLIENT_ID: random_text_for_ci
      GITHUB_CLIENT_SECRET: random_text_for_ci
      GITHUB_CALLBACK_URL: random_text_for_ci
      GOOGLE_CLIENT_ID: random_text_for_ci
      GOOGLE_CLIENT_SECRET: random_text_for_ci
      GOOGLE_CALLBACK_URL: random_text_for_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        run: npm run install:all

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./e2e/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd e2e && npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: cd e2e && npx playwright install-deps chromium

      - name: Run e2e and a11y tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  spell_format:
    runs-on: ubuntu-latest
    name: Run spell and format check
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install all dependencies
        run: npm run install:all

      - name: Check webapp formatting
        run: npm run format:check:webapp

      - name: Check server formatting
        run: npm run format:check:server

      - name: Check e2e formatting
        run: npm run format:check:e2e

      - name: Run spell check
        run: npm run spell

  check_deploy_paths:
    runs-on: ubuntu-latest
    name: Check if deploy is needed
    needs: [lint, type_check, test, e2e, spell_format]
    outputs:
      should_deploy: ${{ steps.changes.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check for deploy-relevant changes
        id: changes
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE '^server/|^docker-compose\.yml$|^Caddyfile$'; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    runs-on: ubuntu-latest
    name: Deploy API
    needs: [check_deploy_paths]
    if: needs.check_deploy_paths.outputs.should_deploy == 'true'
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push server image
        run: |
          docker build -t ghcr.io/goran1010/atlas-univerziteta-server:latest ./server
          docker push ghcr.io/goran1010/atlas-univerziteta-server:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: 188.245.124.7
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/atlas-univerziteta
            docker compose pull server
            docker compose up -d
