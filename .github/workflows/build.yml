name: Build

on:
  pull_request:
    branches:
      - main
  workflow_call:
env:
  DATABASE_URL: postgresql://test_user:test_password@localhost:5432/postgres_db
jobs:
  build:
    runs-on: ubuntu-latest
    name: Run build

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        run: npm run install:all

      - name: Build server
        run: npm run build:server

      - name: Build webapp
        run: npm run build:webapp
