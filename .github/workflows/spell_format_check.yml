name: Spell and Format Check

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  format:
    runs-on: ubuntu-latest
    name: Run formatting check
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm run install:all

      - name: Check webapp formatting
        run: npm run format:check:webapp

      - name: Check server formatting
        run: npm run format:check:server

      - name: Check e2e formatting
        run: npm run format:check:e2e

  spell:
    runs-on: ubuntu-latest
    name: Run spell check
    steps:
      - uses: actions/checkout@v6

      - uses: streetsidesoftware/cspell-action@v8
        with:
          config: ".cspell.json"
