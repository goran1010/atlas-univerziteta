name: Spell and Format Check

on:
  pull_request:
    branches:
      - main
  workflow_call:

jobs:
  format:
    runs-on: ubuntu-latest
    name: Run formatting check
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        run: npm run install:all

      - name: Check webapp formatting
        run: npm run format:check:webapp

      - name: Check server formatting
        run: npm run format:check:server

      - name: Check e2e formatting
        run: npm run format:check:e2e

  spell:
    runs-on: ubuntu-latest
    name: Run spell check
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      # root install only - cspell and its dictionaries are root devDependencies
      - name: Install dependencies
        run: npm install

      - name: Run spell check
        run: npm run spell
